<!DOCTYPE html>
<html>
<head><title>IPC Test</title></head>
<body>
<div id="status">loading</div>
<div id="results"></div>
<script>
  window.addEventListener('load', async () => {
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');

    if (!window.aegisApi) {
      statusEl.textContent = 'FAIL: aegisApi not exposed';
      return;
    }

    const results = [];
    const log = (test, pass, detail) => {
      results.push({ test, pass, detail });
      resultsEl.innerHTML = results.map(r =>
        '<div class="' + (r.pass ? 'pass' : 'fail') + '">' +
        (r.pass ? 'PASS' : 'FAIL') + ' ' + r.test + ': ' + r.detail +
        '</div>'
      ).join('');
    };

    try {
      const ifaces = await window.aegisApi.listInterfaces();
      log('listInterfaces', ifaces.length > 0, 'Found ' + ifaces.length + ' interfaces');
      
      const wifi = ifaces.find(i => i.id.includes('9F0A2CCA') || (i.name.includes('Wi-Fi') && !i.internal));
      if (!wifi) { log('findWifi', false, 'No Wi-Fi found'); statusEl.textContent = 'PARTIAL'; return; }
      log('findWifi', true, wifi.name + ' (' + wifi.id + ')');

      const startResult = await window.aegisApi.startCapture(wifi.id);
      log('startCapture', startResult.success, startResult.message);

      let packetCount = 0;
      const unsubPacket = window.aegisApi.onPacket(() => { packetCount++; });

      let statusCount = 0;
      const unsubStatus = window.aegisApi.onStatus(() => { statusCount++; });

      await new Promise(r => setTimeout(r, 8000));

      log('packetsReceived', packetCount > 0, packetCount + ' packets via IPC');
      log('statusCallbacks', statusCount > 0, statusCount + ' status callbacks via IPC');

      unsubPacket();
      unsubStatus();
      const stopResult = await window.aegisApi.stopCapture();
      log('stopCapture', stopResult.success, 'Capture stopped');

      const finalStatus = await window.aegisApi.getStatus();
      log('finalStatus', !finalStatus.isCapturing, 'isCapturing=' + finalStatus.isCapturing + ', totalProcessed=' + finalStatus.totalProcessed);

      statusEl.textContent = 'DONE';
    } catch (e) {
      statusEl.textContent = 'ERROR: ' + e.message;
    }
  });
</script>
</body>
</html>
