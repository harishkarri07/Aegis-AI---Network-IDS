name: Build, Release & Deploy Aegis AI

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# pnpm is required because this project ships a pnpm-lock.yaml.
# Using npm ci would ignore the lockfile and produce inconsistent installs.
# PNPM MUST be v11+: the lockfile was generated by pnpm 11 and pnpm 9 fails with
# "ERROR packages field missing or empty" because it cannot parse the v11 format.
env:
  PNPM_VERSION: 11

jobs:
  test:
    name: Run IDS Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        # --ignore-scripts: skip the postinstall electron-rebuild. The test job
        # runs pure TypeScript tests via tsx and never loads the native `cap`
        # module (Windows-only Npcap). The build-desktop job runs electron-rebuild
        # explicitly after installing platform build dependencies.
        run: pnpm install --ignore-scripts

      - name: Run Deterministic Engine Tests
        run: pnpm test

  build-desktop:
    name: Build Desktop Artifacts (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            # electron-builder writes the NSIS installer directly to release-builds/
            artifact_path: release-builds/Aegis-Network-IDS-Setup.exe
          - os: macos-latest
            target: mac
            artifact_path: release-builds/Aegis-Network-IDS.dmg
          - os: ubuntu-latest
            target: linux
            artifact_path: release-builds/Aegis-Network-IDS.AppImage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev libarchive-tools

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules for Electron ABI
        # The `cap` native Node addon is compiled against Node.js headers locally;
        # on CI it must be rebuilt against Electron's ABI or the packaged app
        # will fail to load the capture backend at runtime. postinstall also runs
        # this, but we make it explicit so a failed rebuild fails the build loudly.
        run: pnpm exec electron-rebuild

      - name: Build Next.js Dashboard
        run: pnpm run build

      - name: Compile Electron TypeScript
        run: pnpm run compile:electron

      - name: Package Desktop Binary (${{ matrix.target }})
        # Capture the full packaging output to a per-target log file. We use
        # PowerShell (pwsh) because it ships preinstalled on every GitHub-hosted
        # runner (Windows, macOS, Linux), giving one genuinely cross-platform
        # script. On failure the last 120 lines are printed to the Actions
        # console and the complete log is uploaded as an artifact. `exit $code`
        # re-raises the original packaging exit code so the job still fails.
        id: package-desktop
        shell: pwsh
        run: |
          $logFile = "package-${{ matrix.target }}.log"
          pnpm run dist:${{ matrix.target }} *> $logFile
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "===== Last 120 lines of $logFile ====="
            Get-Content $logFile -Tail 120
          }
          exit $code

      - name: Upload packaging log on failure
        if: failure() && steps.package-desktop.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}-log
          path: package-${{ matrix.target }}.log

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-${{ matrix.target }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-website:
    name: Deploy Public Website to GitHub Pages
    # Deploy on pushes to main (not on PRs, not on tags — tags trigger a release
    # which can independently update the website if desired).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        # --ignore-scripts: the deploy job only builds the static Next.js site
        # and never loads the native `cap` capture module. Skipping postinstall
        # avoids an unnecessary electron-rebuild (which requires libpcap-dev /
        # Npcap headers not installed here).
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build static website
        # basePath is required because the site lives at
        # https://<user>.github.io/<repo>/ — without it all asset 404.
        env:
          NEXT_PUBLIC_BASE_PATH: /Aegis-AI---Network-IDS
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
